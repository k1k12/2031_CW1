<!DOCTYPE html>
<html lang='en'>
<head>

    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css'>

</head>

    .table {
        margin-left: auto;

    }

    .box {

        border: 1px solid rgb(151, 151, 151);
        padding: 35px;
        margin: 10px;
    }

    .blue-box {
        width: 500px;
        height: 350px;
        border: 1px solid rgb(6, 0, 194);

        margin: 10px;
    }

</style>

<section class='container-fluid p-3 my-3'>

    <nav class='nav nav-pills flex-column flex-sm-row'>
        <!-- Menu link home -->
        <a class='nav-item nav-link' href='{{ url_for("index") }}'>Home</a>

        <!-- Menu link registration -->
        <a class='nav-item nav-link' href='{{ url_for("accounts.registration") }}'>Registration</a>

        <!-- Menu link login -->

        <!-- Menu link account -->

        <a class='nav-item nav-link' href='{{ url_for("security.security") }}'>Security</a>
